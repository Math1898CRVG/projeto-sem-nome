<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta — Controle de Estoque</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <main class="auth">

        <section class="auth-marca">
            <div class="logo"><span class="logo-icone">CE</span> Controle de Estoque</div>
            <h1>Comece a organizar seu estoque hoje.</h1>
            <p>Crie sua conta, monte seus estoques e cadastre os produtos com a quantidade mínima desejada.</p>
        </section>

        <section class="auth-form-area">
            <div class="auth-card">
                <div>
                    <h2 style="font-size:1.5rem">Criar conta</h2>
                    <p class="muted">Leva menos de um minuto.</p>
                </div>


                <p class="aviso" id="erro-cadastro" hidden>Mensagem de erro retornada pela API de cadastro.</p>


                <form action="#" method="post">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" maxlength="100"
                            placeholder="usuarios.nome — até 100 caracteres" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" maxlength="255"
                            placeholder="usuarios.email — único no sistema" required>
                    </div>

                    <div class="dupla">
                        <div class="campo">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" minlength="6"
                                placeholder="usuarios.senha (hash)" required>
                        </div>
                        <div class="campo">
                            <label for="confirmar">Confirmar senha</label>
                            <input type="password" id="confirmar" name="confirmar" minlength="6"
                                placeholder="repita a senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn">Criar conta</button>
                </form>

                <p class="auth-rodape">Já tem conta? <a href="login.html">Entrar</a></p>
            </div>
        </section>

    </main>
</body>

</html>
